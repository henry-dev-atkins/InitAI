# Project-local Codex configuration for team/orchestrator sessions.
# Project config is intended to be loaded only after the repo is trusted.

[agents]
# Enough room for one orchestrator, several write workers, and read-only reviewers.
max_threads = 8

# Normal work should stay at depth 1. Depth 2 is reserved for explicit [TEAM]/[ORCHESTRATOR] sessions
# where task packets authorise worker agents to spawn read-only review/diagnosis subagents.
max_depth = 2

# Long research/validation jobs should use [MONITOR] and explicit result packets.
job_max_runtime_seconds = 7200
